name: cookie_store_conformance_tests
description: >-
  A library that tests whether implementations of package:cookie_store's `CookieStore`
  class behave as expected.
repository: https://github.com/foldland/cookie_store
issue_tracker: https://github.com/foldland/cookie_store/issues
version: 0.1.0+2
publish_to: none

resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  cookie_store:
    git:
      url: https://github.com/foldland/cookie_store
      path: packages/cookie_store
      tag_pattern: cookie_store-v{{version}}
    version: ^0.1.0+2
  meta: ^1.0.0
  test: ^1.21.2
